name: chromify
description: "Chromify — управление RGB-лентой через BLE-контроллер ELK-BLEDOM."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  universal_ble: ^2.2.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  flutter_animate: ^4.5.2
  permission_handler: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  android: true
  adaptive_icon_background: "#0B0B18"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  web:
    generate: true
    background_color: "#0B0B18"
    theme_color: "#6C7BFF"
  windows:
    generate: true
    icon_size: 256

flutter:
  uses-material-design: true

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
          weight: 400
        - asset: assets/fonts/Manrope.ttf
          weight: 500
        - asset: assets/fonts/Manrope.ttf
          weight: 600
        - asset: assets/fonts/Manrope.ttf
          weight: 700
        - asset: assets/fonts/Manrope.ttf
          weight: 800
