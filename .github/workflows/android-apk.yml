name: Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test

      - name: Regenerate launcher icons
        working-directory: app
        run: dart run flutter_launcher_icons

      - name: Build Android release APK
        working-directory: app
        run: flutter build apk --release

      - name: Read app version
        id: ver
        working-directory: app
        run: |
          v=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version:\s*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "version = $v"

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-release.apk "dist/Chromify-${{ steps.ver.outputs.version }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chromify-APK
          path: dist/Chromify-${{ steps.ver.outputs.version }}.apk
          if-no-files-found: error

      # На push тега используем сам тег; при ручном запуске (workflow_dispatch)
      # тега нет — action-gh-release создаёт его из версии в pubspec.yaml,
      # используя штатный GITHUB_TOKEN раннера (permissions: contents: write
      # выше), в обход человеческих прав на пуш тегов.
      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          files: dist/Chromify-${{ steps.ver.outputs.version }}.apk
