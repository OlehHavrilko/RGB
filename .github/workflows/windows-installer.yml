name: Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test

      - name: Regenerate launcher icons
        working-directory: app
        run: dart run flutter_launcher_icons

      - name: Build Windows release
        working-directory: app
        run: flutter build windows --release

      - name: Read app version
        id: ver
        shell: pwsh
        run: |
          $line = Select-String -Path app/pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)'
          $v = $line.Matches[0].Groups[1].Value
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "version = $v"

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
          }

      - name: Compile installer
        shell: pwsh
        run: iscc /DMyAppVersion=${{ steps.ver.outputs.version }} installer\chromify.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chromify-Setup-x64
          path: dist/Chromify-Setup-x64.exe
          if-no-files-found: error

      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Chromify-Setup-x64.exe
